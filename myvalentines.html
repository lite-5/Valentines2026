<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Comic Sans MS', cursive;
    background-image: url("image/bgr.jpeg");
    overflow: hidden;
}

/* background hearts */
.hearts {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#ff6b81 2px, transparent 2px);
    background-size: 40px 40px;
    opacity: 0.4;
    z-index: -1;
}

/* main card */
.card {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* first screen */
.box {
    background-image: url("image/bgr.jpeg");
    padding: 30px 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.box img {
    width: 150px;
}

button {
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
    color: white;
}

.yes { background: #2ecc71; }
.no  { background: #e74c3c; }

/* YES layout */
.yes-layout {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    gap: 20px;
}

/* image columns */
.column {
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 10px;
    overflow-y: auto;
}

.column img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 10px;
}

/* center text */
.center-text {
    background-image: url("image/4f.png");
    border-radius: 25px;
    display: flex;
    flex-direction: column;   /* stack items vertically */
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.center-text h1 {
    font-size: 36px;
    color: #bc1ad1;
}

/* flower rain */
.flower {
    position: fixed;
    top: -50px;
    font-size: 30px;
    animation: fall linear forwards;

}
/* IMAGE POPUP OVERLAY */
.image-popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8) ;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    animation: fadeIn 0.3s ease;
}

.image-popup img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    animation: zoomIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes zoomIn {
    from { transform: scale(0.7); }
    to { transform: scale(1); }
}


@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="hearts"></div>

<div class="card" id="card">
    <div class="box">
        
        <h1>Will you be my Valentine?</h1>
        <button class="yes" onclick="yesClicked()">Yes</button>
        <button class="no" onclick="noClicked()">No</button>
    </div>
</div>

<script>
    // IMAGE CLICK POPUP FEATURE
document.addEventListener("click", function(e) {
    if (e.target.tagName === "IMG") {
        const popup = document.createElement("div");
        popup.className = "image-popup";

        const bigImg = document.createElement("img");
        bigImg.src = e.target.src;

        popup.appendChild(bigImg);
        document.body.appendChild(popup);

        popup.addEventListener("click", () => {
            popup.remove();
        });
    }
});

function yesClicked() {
    document.getElementById("card").innerHTML = `
        <div class="yes-layout">
            <!-- LEFT COLUMN -->
            <div class="column">
                <img src="image/1.png">
                <img src="image/2.png">
                <img src="image/3.png">
                <img src="image/4.png">
            </div>

            <!-- CENTER -->
            <div class="center-text">
                <h1>
                    💖 Happy Valentine's 
                    I love you 🌹
                </h1>
                <button onclick="flowerExplosion()" 
            style="
                margin-top:20px;
                background-color: rgb(235, 11, 209);
                padding:12px 25px;
                border:none;
                border-radius:15px;
                font-size:18px;
                color:white;
                cursor:pointer;
                box-shadow:0 5px 15px rgba(0,0,0,0.3);
               
            ">
            💕 flowers for you 💕
        </button>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="column">
                <img src="image/5.png">
                <img src="image/6.png">
                <img src="image/7.png">
                <img src="image/8.png">
            </div>
        </div>
    `;

    startFlowers();
}

function noClicked() {
    alert("❌ Wrong answer! Try again 😝");
}

function startFlowers() {
    setInterval(() => {
        const flower = document.createElement("div");
        flower.className = "flower";
        flower.innerHTML = "❀";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(flower);

        setTimeout(() => flower.remove(), 6000);
    }, 200);
}
function flowerExplosion() {
    for (let i = 0; i < 80; i++) {
        const flower = document.createElement("div");
        flower.className = "flower";
        flower.innerHTML = "🌸💐";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.fontSize = (Math.random() * 20 + 20) + "px";
        flower.style.animationDuration = (Math.random() * 2 + 2) + "s";

        document.body.appendChild(flower);

        setTimeout(() => flower.remove(), 5000);
    }
}

</script>

</body>
</html>
